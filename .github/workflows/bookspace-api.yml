name: Testes BookSpace API

on:
  push:
    paths:
      - 'backend/**'
      - 'Projeto-empresa-fictícia/**'
      - '.github/workflows/bookspace-api.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'backend/**'
      - 'Projeto-empresa-fictícia/**'
      - '.github/workflows/bookspace-api.yml'
      - 'README.md'

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Verificar sintaxe do front-end
        run: node --check '../Projeto-empresa-fictícia/script.js'
      - name: Verificar sintaxe do back-end
        run: |
          node --check src/app.js
          node --check src/store.js
          node --check src/server.js
      - name: Rodar testes da API
        run: npm test
      - name: Instalar Chromium para teste da interface
        run: npx playwright install --with-deps chromium
      - name: Testar sistema integrado no navegador
        run: npm run test:browser
      - name: Gerar evidencias do repositorio e dos commits
        run: node test/github-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bookspace-evidencias
          path: backend/artifacts/*
          if-no-files-found: ignore
