name: Testes BookSpace API

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/bookspace-api.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/bookspace-api.yml'

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Rodar testes
        run: npm test
