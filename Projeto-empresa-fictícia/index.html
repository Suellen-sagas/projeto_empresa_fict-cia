<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <img src="imagens/LOgo-removebg-preview.png" alt="BookSpace Biblioteca" class="logo-login">

        <div class="login-box">

            <h1>Entrar</h1>

            <p class="subtitle">
                Acesse sua conta
            </p>

            <form>

                <div class="input-group">
                    <label for="email">E-mail</label>

                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>


                <div class="input-group">
                    <label for="senha">Senha</label>

                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                </div>


                <div class="options">

                    <label>
                        <input type="checkbox">
                        Lembrar de mim
                    </label>

                    <a href="#">
                        Esqueci minha senha
                    </a>

                </div>


                <a href="livros.html" class="botao-entrar">
                    Entrar
                </a>

            </form>


            <div class="register">

                <p>
                    Ainda não possui uma conta?
                    <a href="cadastro.html">Criar conta</a>
                </p>

            </div>

        </div>

    </div>

</body>

</html>
