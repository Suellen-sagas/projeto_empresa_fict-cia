<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha conta | BookSpace</title>
    <link rel="stylesheet" href="conta.css">
</head>
<body>
    <header class="header">
        <a href="livros.html" class="logo">Book<span>Space</span></a>
        <nav>
            <a href="livros.html">Livros</a>
            <a href="alugueis.html">Meus aluguéis</a>
            <a href="conta.html">Minha conta</a>
            <a href="carrinho.html">Carrinho</a>
            <a href="index.html" class="sair">Sair</a>
        </nav>
    </header>

    <main class="container">
        <section class="titulo">
            <h1>Minha conta</h1>
            <p>Confira e atualize seus dados.</p>
        </section>

        <section class="perfil">
            <div class="avatar">S</div>

            <form action="conta.html" class="form-perfil">
                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" value="Suellen Sagas">
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" value="suellen@email.com">
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" value="(48) 99999-9999">
                </div>

                <div class="campo">
                    <label for="senha">Nova senha</label>
                    <input type="password" id="senha" placeholder="Deixe em branco para não alterar">
                </div>

                <button type="submit">Salvar alterações</button>
            </form>
        </section>
    </main>
</body>
</html>
