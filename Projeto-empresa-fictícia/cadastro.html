<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | AcadEvents</title>

    <link rel="stylesheet" href="cadastro.css">
</head>

<body>

    <div class="cadastro-container">

        <div class="cadastro-box">

            <!-- Cabeçalho -->
            <div class="header">

                <h1>Book<span>Space</span></h1>

                <h2>Crie sua conta</h2>

            </div>


            <!-- Formulário -->
            <form>

                <div class="input-group">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input type="text" id="nome" placeholder="Digite seu nome completo" required>

                </div>


                <div class="input-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input type="email" id="email" placeholder="Digite seu e-mail" required>

                </div>


                <div class="input-group">

                    <label for="cpf">
                        CPF
                    </label>

                    <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>

                </div>


                <div class="input-group">

                    <label for="tipo">
                        Tipo de usuário
                    </label>

                    <select id="tipo" required>

                        <option value="">
                            Selecione uma opção
                        </option>

                        <option value="aluno">
                            Aluno
                        </option>

                        <option value="professor">
                            Professor
                        </option>

                        <option value="organizador">
                            Organizador
                        </option>

                    </select>

                </div>


                <div class="input-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input type="password" id="senha" placeholder="Digite sua senha" required>

                </div>


                <div class="input-group">

                    <label for="confirmar-senha">
                        Confirmar senha
                    </label>

                    <input type="password" id="confirmar-senha" placeholder="Confirme sua senha" required>

                </div>


                <label class="termos">

                    <input type="checkbox" required>

                    <span>
                        Concordo com os termos de uso
                        e a política de privacidade.
                    </span>

                </label>


                <button type="submit">
                    Criar conta
                </button>

            </form>


            <!-- Link para login -->
            <div class="login">

                <p>
                    Já possui uma conta?

                    <a href="index.html">
                        Entrar
                    </a>
                </p>

            </div>

        </div>

    </div>

</body>

</html>
