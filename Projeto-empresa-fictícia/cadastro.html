<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | BookSpace</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <main class="cadastro-container">
        <section class="cadastro-box">
            <div class="header-cadastro">
                <img src="imagens/logo-bookspace.png" alt="Logo BookSpace" class="logo-cadastro">
                <h1>Criar conta</h1>
                <p>Preencha seus dados para começar.</p>
            </div>

            <form action="index.html">
                <div class="input-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="input-group">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
                </div>

                <div class="input-group">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Digite a senha novamente" required>
                </div>

                <label class="termos">
                    <input type="checkbox" required>
                    <span>Concordo com os termos de uso.</span>
                </label>

                <button type="submit">Criar conta</button>
            </form>

            <p class="login-link">Já possui uma conta? <a href="index.html">Entrar</a></p>
        </section>
    </main>
</body>
</html>
